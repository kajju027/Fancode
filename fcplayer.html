<script>
(function () {
'use strict';

/* ── Config ──────────────────────────────────── */
var JSON_URL  = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/main/fancode.json';
var LANG_MAP  = { eng:'ENGLISH',hin:'HINDI',tam:'TAMIL',tel:'TELUGU',ben:'BENGALI',mar:'MARATHI' };
var Q_ORDER   = ['1080p','720p','540p','480p','360p','240p'];

/* ── URL params ──────────────────────────────── */
var sp       = new URLSearchParams(location.search);
var idParam  = sp.get('id') || '';
var si       = parseInt(sp.get('s') || '0', 10);
var ui       = idParam.indexOf('_');
var matchId  = ui > -1 ? idParam.slice(0, ui) : idParam;
var langCode = ui > -1 ? idParam.slice(ui + 1) : 'eng';

/* ── DOM ─────────────────────────────────────── */
var vid     = document.getElementById('vid');
var player  = document.getElementById('player');
var overlay = document.getElementById('overlay');
var spinner = document.getElementById('spinner');
var errCard = document.getElementById('err-card');
var etitle  = document.getElementById('etitle');
var emsg    = document.getElementById('emsg');
var ctrls   = document.getElementById('ctrls');
var prog    = document.getElementById('prog');
var pbuf    = document.getElementById('pbuf');
var pplay   = document.getElementById('pplay');
var pthumb  = document.getElementById('pthumb');
var tdisp   = document.getElementById('tdisp');
var bplay   = document.getElementById('bplay');
var bvol    = document.getElementById('bvol');
var svol    = document.getElementById('svol');
var bq      = document.getElementById('bq');
var qlbl    = document.getElementById('qlbl');
var bpip    = document.getElementById('bpip');
var bfs     = document.getElementById('bfs');
var fsico   = document.getElementById('fsico');
var qpop    = document.getElementById('qpop');
var lbtn    = document.getElementById('lbtn');

/* ── State ───────────────────────────────────── */
var hls        = null;
var qStreams   = {};
var currentQ   = '720p';
var isLive     = true;
var hideTimer  = null;
var isDragging = false;
var uPaused    = false;
var ctrlsOn    = true;

/* ── Popup ───────────────────────────────────── */
function closePopup() { document.getElementById('popup').classList.add('gone'); }
document.getElementById('bjoin').addEventListener('click', closePopup);
document.getElementById('bskip').addEventListener('click', closePopup);

/* ── Overlay helpers ─────────────────────────── */
function showLoad() {
  overlay.classList.remove('gone');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'none';
  spinner.style.display = 'block';
  errCard.style.display = 'none';
}
function hideOverlay() {
  overlay.style.opacity = '0';
  overlay.style.pointerEvents = 'none';
  setTimeout(function () { overlay.classList.add('gone'); }, 360);
}
function showErr(title, msg) {
  overlay.classList.remove('gone');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'auto';
  spinner.style.display = 'none';
  errCard.style.display = 'block';
  etitle.textContent = title;
  emsg.textContent   = msg || '';
}

/* ── Controls show / hide ────────────────────── */
function showCtrls() {
  ctrls.classList.remove('gone');
  lbtn.classList.add('on');
  clearTimeout(hideTimer);
  if (!vid.paused) {
    hideTimer = setTimeout(function () {
      ctrls.classList.add('gone');
      lbtn.classList.remove('on');
      qpop.classList.remove('on');
    }, 3000);
  }
}
player.addEventListener('mousemove', showCtrls);
player.addEventListener('touchstart', showCtrls, { passive: true });
player.addEventListener('click', function (e) {
  if (e.target === vid || e.target === player) {
    if (ctrls.classList.contains('gone')) { showCtrls(); }
    else { togglePlay(); }
  }
});
showCtrls();

/* ── Play / Pause ────────────────────────────── */
function togglePlay() {
  if (vid.paused) vid.play().catch(function () {});
  else            vid.pause();
}
bplay.addEventListener('click', togglePlay);

function syncPlayIcon() {
  bplay.querySelector('svg').innerHTML = vid.paused
    ? '<path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z" fill="currentColor"/>'
    : '<rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>';
}
vid.addEventListener('play',  function () { syncPlayIcon(); showCtrls(); });
vid.addEventListener('pause', function () { syncPlayIcon(); showCtrls(); });

/* ── Volume ──────────────────────────────────── */
bvol.addEventListener('click', function () { vid.muted = !vid.muted; syncVolIcon(); });
function syncVolIcon() {
  svol.innerHTML = vid.muted
    ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
    : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
}

/* ── Progress ────────────────────────────────── */
function pct(n) { return Math.max(0, Math.min(100, n)) + '%'; }

vid.addEventListener('timeupdate', function () {
  if (isDragging) return;
  var p = (vid.duration && isFinite(vid.duration)) ? vid.currentTime / vid.duration * 100 : 99.4;
  pplay.style.width   = pct(p);
  pthumb.style.left   = pct(p);
  updateTime();
});
vid.addEventListener('progress', function () {
  if (!vid.buffered.length || !isFinite(vid.duration)) return;
  pbuf.style.width = pct(vid.buffered.end(vid.buffered.length - 1) / vid.duration * 100);
});
vid.addEventListener('loadedmetadata', function () {
  isLive = !isFinite(vid.duration) || vid.duration > 86400;
  updateTime();
});

function updateTime() {
  if (isLive) {
    tdisp.innerHTML = '<span class="live-pill">LIVE</span>';
  } else {
    tdisp.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
  }
}
function fmt(s) {
  if (!s || !isFinite(s)) return '0:00';
  var m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

/* drag seek */
function seekPct(e) {
  var rect = prog.getBoundingClientRect();
  var x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  return Math.max(0, Math.min(1, x / rect.width));
}
function applySeek(f) {
  if (!isFinite(vid.duration)) return;
  vid.currentTime = f * vid.duration;
  var p = f * 100;
  pplay.style.width = pct(p); pthumb.style.left = pct(p);
}
prog.addEventListener('mousedown',  function (e) { isDragging = true; prog.classList.add('drag'); applySeek(seekPct(e)); });
prog.addEventListener('touchstart', function (e) { isDragging = true; prog.classList.add('drag'); applySeek(seekPct(e)); }, { passive: true });
document.addEventListener('mousemove',  function (e) { if (isDragging) applySeek(seekPct(e)); });
document.addEventListener('touchmove',  function (e) { if (isDragging) { e.preventDefault(); applySeek(seekPct(e)); } }, { passive: false });
document.addEventListener('mouseup',    function () { if (isDragging) { isDragging = false; prog.classList.remove('drag'); } });
document.addEventListener('touchend',   function () { if (isDragging) { isDragging = false; prog.classList.remove('drag'); } });

/* ── Fullscreen ──────────────────────────────── */
bfs.addEventListener('click', function () {
  var inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (!inFs) {
    if (player.requestFullscreen)        player.requestFullscreen();
    else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
    else if (vid.webkitEnterFullscreen)  vid.webkitEnterFullscreen();
  } else {
    if (document.exitFullscreen)         document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
});
function syncFsIcon() {
  var inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  fsico.innerHTML = inFs
    ? '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>'
    : '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
}
document.addEventListener('fullscreenchange', syncFsIcon);
document.addEventListener('webkitfullscreenchange', syncFsIcon);

/* ── PiP ─────────────────────────────────────── */
if (!document.pictureInPictureEnabled) bpip.style.display = 'none';
bpip.addEventListener('click', function () {
  if (document.pictureInPictureElement) document.exitPictureInPicture().catch(function () {});
  else vid.requestPictureInPicture().catch(function () {});
});

/* ── Quality menu ────────────────────────────── */
function buildQMenu(streams) {
  var avail = Q_ORDER.filter(function (q) { return streams[q]; });
  if (!avail.length) { bq.style.display = 'none'; return; }
  bq.style.display = '';
  var h = '<div class="qhd">Quality</div>';
  avail.forEach(function (q) {
    h += '<div class="qopt' + (q === currentQ ? ' on' : '') + '" data-q="' + q + '">' + q + '<span class="qdot"></span></div>';
  });
  qpop.innerHTML = h;
  qpop.querySelectorAll('.qopt').forEach(function (el) {
    el.addEventListener('click', function () {
      var q = el.dataset.q;
      qpop.classList.remove('on');
      if (q !== currentQ) switchQ(q);
    });
  });
}
bq.addEventListener('click', function (e) {
  e.stopPropagation();
  qpop.classList.toggle('on');
  showCtrls();
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('#bq') && !e.target.closest('#qpop')) qpop.classList.remove('on');
});

function switchQ(q) {
  if (!qStreams[q]) return;
  currentQ = q; qlbl.textContent = q;
  qpop.querySelectorAll('.qopt').forEach(function (o) { o.classList.toggle('on', o.dataset.q === q); });
  loadHLS(qStreams[q]);
}

/* ── Auto-resume ─────────────────────────────── */
vid.addEventListener('pause', function () {
  if (!vid.ended && !uPaused) setTimeout(function () { if (vid.paused && !vid.ended) vid.play().catch(function () {}); }, 600);
  setTimeout(function () { uPaused = false; }, 120);
});
vid.addEventListener('play', function () { uPaused = false; });
setInterval(function () { if (vid.paused && !vid.ended && !uPaused) vid.play().catch(function () {}); }, 3500);

/* ── HLS loader ──────────────────────────────── */
function loadHLS(url) {
  if (hls) { hls.destroy(); hls = null; }

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ startLevel: -1, enableWorker: true, lowLatencyMode: true,
                    maxBufferLength: 30, maxMaxBufferLength: 60 });
    hls.loadSource(url);
    hls.attachMedia(vid);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      vid.muted = false;
      vid.play().catch(function () {
        vid.muted = true;
        vid.play().catch(function () {});
        setTimeout(function () { vid.muted = false; vid.play().catch(function () {}); }, 1000);
      });
    });
    hls.on(Hls.Events.ERROR, function (e, d) {
      if (d.fatal) {
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR)      hls.startLoad();
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR)   hls.recoverMediaError();
        else showErr('Playback Error', d.details + (d.reason ? ' — ' + d.reason : ''));
      }
    });
  } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
    vid.src = url;
    vid.muted = false;
    vid.play().catch(function () { vid.muted = true; vid.play().catch(function () {}); setTimeout(function () { vid.muted = false; vid.play().catch(function () {}); }, 1000); });
  } else {
    showErr('Browser not supported', 'This browser cannot play HLS streams. Please use Chrome or Safari.');
    return;
  }
  vid.addEventListener('playing', function onP() { vid.removeEventListener('playing', onP); hideOverlay(); });
  setTimeout(hideOverlay, 8000);
}

/* ── JSON fetch ──────────────────────────────── */
function fetchJSON(url) {
  return new Promise(function (res, rej) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 10000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { res(JSON.parse(x.responseText)); }
        catch (e) { rej(new Error('JSON parse error: ' + e.message)); }
      } else { rej(new Error('HTTP ' + x.status + ' fetching JSON')); }
    };
    x.onerror   = function () { rej(new Error('Network error (no connection?)')); };
    x.ontimeout = function () { rej(new Error('Request timed out (10 s)')); };
    x.send();
  });
}

function resolve(data) {
  var list = Array.isArray(data) ? data :
             Array.isArray(data.matches) ? data.matches :
             Array.isArray(data.events) ? data.events : [];
  if (!list.length) throw new Error('Empty match list in JSON');
  var m = null;
  for (var i = 0; i < list.length; i++) if (String(list[i].match_id) === String(matchId)) { m = list[i]; break; }
  if (!m) throw new Error('match_id "' + matchId + '" not found (' + list.length + ' entries checked)');

  if (si === 0) {
    if (!m.auto_streams || !Object.keys(m.auto_streams).length) throw new Error('auto_streams empty for this match');
    var lang = LANG_MAP[langCode] || m.language || 'ENGLISH';
    var al = m.auto_streams[lang];
    if (!al || !al.streams) {
      var k = Object.keys(m.auto_streams);
      if (!k.length) throw new Error('No language key in auto_streams');
      al = m.auto_streams[k[0]]; lang = k[0];
    }
    if (!al || !al.streams || !Object.keys(al.streams).length) throw new Error('streams object empty for "' + lang + '"');
    return { type: 'multi', streams: al.streams };
  }
  var s = m.streams || {};
  var u = si === 1 ? s.fancode_lk_cdn : si === 2 ? s.fancode_np_cdn : si === 3 ? s.fancode_bd_cdn : null;
  if (!u) throw new Error('Regional stream (s=' + si + ') not available for this match');
  return { type: 'single', url: u };
}

/* ── Boot ────────────────────────────────────── */
(function start() {
  showLoad();
  if (!matchId) { showErr('Missing match ID', 'URL must contain ?id=MATCHID_LANG&s=0  e.g. ?id=143540_eng&s=0'); return; }

  fetchJSON(JSON_URL).then(function (data) {
    var r;
    try { r = resolve(data); }
    catch (e) { showErr('Stream Unavailable', e.message); return; }

    if (r.type === 'multi') {
      qStreams = r.streams;
      var url = r.streams['720p'] || r.streams['1080p'] || r.streams['480p'] || r.streams['540p'] || r.streams['360p'] || r.streams['240p'];
      if (!url) { showErr('No stream URL', 'All quality URLs are empty for this match'); return; }
      currentQ = Q_ORDER.find(function (q) { return r.streams[q] === url; }) || '720p';
      qlbl.textContent = currentQ;
      buildQMenu(r.streams);
      loadHLS(url);
    } else {
      bq.style.display = 'none';
      qlbl.textContent = '';
      loadHLS(r.url);
    }
  }).catch(function (e) { showErr('Could not load stream data', e.message); });
})();
