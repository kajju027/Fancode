<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;height:-webkit-fill-available;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{width:100%;height:100%;min-height:100dvh;min-height:-webkit-fill-available;background:#000;overflow:hidden;font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;}

/* ── Logo ── */
.logo-btn{position:fixed;top:10px;left:10px;z-index:50;display:flex;align-items:center;text-decoration:none;transition:opacity .2s;}
.logo-btn:hover{opacity:.8;}
.logo-btn img{height:36px;width:auto;border-radius:7px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.8));}

/* ── Original Popup ── */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:20px;z-index:99999;}
.popup-overlay.visible{display:flex;}
.popup-wrap{position:relative;width:100%;max-width:358px;padding:2px;background:linear-gradient(145deg,rgba(255,204,0,.8) 0%,rgba(255,224,80,.4) 50%,rgba(255,204,0,.8) 100%);border-radius:18px;box-shadow:0 0 50px rgba(255,204,0,.14),0 30px 70px rgba(0,0,0,.72);animation:popIn .42s cubic-bezier(.175,.885,.32,1.275) both;}
@keyframes popIn{from{opacity:0;transform:scale(.87) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
.popup-box{background:linear-gradient(168deg,#1e1e26 0%,#0e0e13 100%);border-radius:16px;padding:34px 24px 26px;text-align:center;}
.popup-title{color:#ffcc00;font-family:'Acme',sans-serif;font-size:30px;letter-spacing:.5px;margin-bottom:12px;}
.popup-text{color:#a0a0a8;font-size:14px;line-height:1.65;margin-bottom:24px;}
.popup-text b{color:#fff;font-family:'Amaranth',sans-serif;font-size:17px;display:block;margin-top:7px;}
.btn-popup{width:100%;padding:14px;border:none;border-radius:13px;font-family:'Amaranth',sans-serif;cursor:pointer;transition:transform .18s,box-shadow .18s;-webkit-appearance:none;appearance:none;touch-action:manipulation;text-decoration:none;display:block;}
.btn-popup:active{transform:scale(.95);}
.btn-join-main{background:linear-gradient(90deg,#1bcc26,#17b823);color:#fff;font-size:18px;font-weight:700;letter-spacing:.6px;box-shadow:0 5px 20px rgba(23,184,35,.32);margin-bottom:9px;text-align:center;line-height:1;}
.btn-join-main:hover{box-shadow:0 8px 26px rgba(23,184,35,.42);}
.btn-joined-main{background:transparent;color:#484850;font-size:12px;font-weight:400;width:auto;margin:0 auto;padding:7px 14px;text-align:center;}

/* ── Player ── */
#player{position:fixed;inset:0;background:#000;user-select:none;-webkit-user-select:none;}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}

/* ── Loading overlay ── */
#overlay{position:absolute;inset:0;z-index:10;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .35s;}
#overlay.gone{opacity:0;pointer-events:none;}
.spin-wrap{position:relative;width:52px;height:52px;}
.spin-outer{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#ffcc00;border-right-color:rgba(255,204,0,.18);animation:rot 1s cubic-bezier(.55,.1,.45,.9) infinite;}
.spin-inner{position:absolute;inset:10px;border-radius:50%;border:3px solid transparent;border-top-color:rgba(255,255,255,.6);border-right-color:rgba(255,255,255,.1);animation:rot-rev .8s cubic-bezier(.55,.1,.45,.9) infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes rot-rev{to{transform:rotate(-360deg)}}
.spin-label{font-size:13px;font-weight:500;color:rgba(255,255,255,.5);letter-spacing:.3px;}

/* ── Error overlay ── */
#err-overlay{position:absolute;inset:0;z-index:11;background:#0d0d16;display:none;align-items:center;justify-content:center;padding:24px;}
#err-overlay.show{display:flex;}
.err-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:20px;padding:44px 28px 36px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.err-icon-wrap{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
.err-icon-wrap svg{width:32px;height:32px;stroke:rgba(255,255,255,.5);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.err-title-txt{font-size:20px;font-weight:700;color:#efefef;margin-bottom:8px;}
.err-body-txt{font-size:13px;color:rgba(255,255,255,.38);line-height:1.75;margin-bottom:24px;}
.err-retry-row{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:rgba(255,255,255,.32);margin-bottom:24px;}
.err-dot{width:6px;height:6px;border-radius:50%;background:#ffcc00;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.err-contact{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:50px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:600;text-decoration:none;transition:background .2s;}
.err-contact:hover{background:rgba(255,255,255,.13);}
.err-contact svg{width:15px;height:15px;fill:#fff;flex-shrink:0;}

/* ── Center play button (premium, small) ── */
#bigplay{position:absolute;inset:0;z-index:16;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .22s;}
#bigplay.shown{pointer-events:auto;}
#bigplay.gone{opacity:0;pointer-events:none;}
.bp{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .16s,background .16s,border-color .16s;box-shadow:0 4px 20px rgba(0,0,0,.4);}
.bp:hover{transform:scale(1.08);background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.7);}
.bp:active{transform:scale(.92);}
.bp svg{width:22px;height:22px;margin-left:3px;}

/* ── Controls ── */
#ctrls{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:50px 0 0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.22) 70%,transparent 100%);transition:opacity .28s;}
#ctrls.gone{opacity:0;pointer-events:none;}

/* progress bar */
#prog{margin:0 14px 7px;height:20px;display:flex;align-items:center;cursor:pointer;position:relative;}
.pt{position:relative;height:3px;width:100%;background:rgba(255,255,255,.22);border-radius:2px;transition:height .14s;overflow:visible;}
#prog:hover .pt,#prog.drag .pt{height:5px;}
.pbf{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.35);border-radius:2px;width:0;}
.ppl{position:absolute;left:0;top:0;height:100%;background:#ff3b30;border-radius:2px;width:0;}
.pth{position:absolute;top:50%;left:0;width:13px;height:13px;background:#ff3b30;border:2.5px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(255,59,48,.25),0 0 8px rgba(255,59,48,.45);pointer-events:none;transition:transform .13s;}
#prog:hover .pth,#prog.drag .pth{transform:translate(-50%,-50%) scale(1.28);}

/* control row */
#crow{display:flex;align-items:center;padding:0 6px 10px;gap:2px;}
.cb{background:none;border:none;cursor:pointer;padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s,transform .12s;flex-shrink:0;}
.cb:hover{background:rgba(255,255,255,.12);}
.cb:active{transform:scale(.87);}
.cb svg{display:block;}
.csp{flex:1;}
.ct{font-size:12px;font-weight:500;color:rgba(255,255,255,.85);padding:0 4px;white-space:nowrap;}

/* live pill */
.live-pill-btn{display:flex;align-items:center;gap:5px;padding:4px 9px 4px 6px;border-radius:20px;background:rgba(255,69,69,.14);border:1px solid rgba(255,69,69,.35);font-size:11px;font-weight:700;letter-spacing:.5px;color:#ff5a5a;cursor:default;flex:none;}
.live-pill-btn.behind{color:#ffb020;background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.35);cursor:pointer;}
.live-pill-btn.behind:hover{background:rgba(255,176,32,.24);}
.ldot{width:6px;height:6px;border-radius:50%;background:#ff4545;animation:lblink 1.4s infinite;flex:none;}
.live-pill-btn.behind .ldot{background:#ffb020;animation:none;}
@keyframes lblink{0%,100%{opacity:1}50%{opacity:.3}}

/* quality button */
#bq{border-radius:8px!important;padding:5px 10px!important;background:rgba(255,255,255,.1)!important;gap:4px;}
#bq:hover{background:rgba(255,255,255,.2)!important;}
#qlbl{font-size:11.5px;font-weight:700;color:#fff;letter-spacing:.3px;}
.qchev{flex-shrink:0;}

/* quality popup — original style */
#qpop{position:absolute;right:14px;bottom:72px;z-index:30;min-width:158px;background:linear-gradient(165deg,rgba(34,34,40,.93),rgba(18,18,22,.93));-webkit-backdrop-filter:blur(24px) saturate(200%);backdrop-filter:blur(24px) saturate(200%);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:1px;max-height:260px;overflow-y:auto;box-shadow:0 20px 45px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);transform-origin:bottom right;transform:scale(.9) translateY(6px);opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.34,1.56,.64,1),opacity .18s ease;}
#qpop.on{transform:scale(1) translateY(0);opacity:1;pointer-events:auto;}
.qhd{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.35);padding:6px 10px 8px;}
.qopt{padding:10px 12px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.78);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .15s,color .15s;}
.qopt:hover{background:rgba(255,255,255,.09);color:#fff;}
.qopt.on{color:#0A84FF;font-weight:700;background:rgba(10,132,255,.12);}
.qopt.on::after{content:'';width:6px;height:6px;border-radius:50%;background:#0A84FF;flex:none;}

.wm{position:absolute;z-index:15;bottom:72px;right:14px;font-size:11px;font-weight:600;color:rgba(255,255,255,.08);letter-spacing:.5px;text-transform:uppercase;pointer-events:none;}

@media(max-width:700px){
  .cb svg{transform:scale(.92);}
  .wm{font-size:9px;bottom:66px;}
  #qpop{right:10px;bottom:66px;}
}
</style>

<script>
(function(){
'use strict';

var JSON_URL = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
var LANG_MAP = {eng:'ENGLISH',hin:'HINDI',tam:'TAMIL',tel:'TELUGU',ben:'BENGALI',mar:'MARATHI'};
var Q_ORDER  = ['1080p','720p','540p','480p','360p','240p'];

var sp = new URLSearchParams(location.search);
var idp = sp.get('id') || '';
var si  = parseInt(sp.get('s') || '0', 10);
var ui  = idp.indexOf('_');
var matchId  = ui > -1 ? idp.slice(0, ui) : idp;
var langCode = ui > -1 ? idp.slice(ui + 1) : 'eng';

var vid      = document.getElementById('vid');
var player   = document.getElementById('player');
var overlay  = document.getElementById('overlay');
var errOv    = document.getElementById('err-overlay');
var ctrls    = document.getElementById('ctrls');
var prog     = document.getElementById('prog');
var pbuf     = document.getElementById('pbuf');
var ppl      = document.getElementById('ppl');
var pth      = document.getElementById('pth');
var bplay    = document.getElementById('bplay');
var pico     = document.getElementById('pico');
var bvol     = document.getElementById('bvol');
var vico     = document.getElementById('vico');
var blivepill= document.getElementById('blivepill');
var lpitext  = document.getElementById('lpitext');
var bq       = document.getElementById('bq');
var qlbl     = document.getElementById('qlbl');
var bpip     = document.getElementById('bpip');
var bfs      = document.getElementById('bfs');
var fsico    = document.getElementById('fsico');
var qpop     = document.getElementById('qpop');
var bigplay  = document.getElementById('bigplay');
var bpbtn    = document.getElementById('bpbtn');

var shakaPlayer = null;
var qStreams = {}, currentQ = '720p';
var isLive = true, isDragging = false, uPaused = false, hasError = false;
var hideTimer = null, retryTimer = null;

/* ── Popup ── */
function closePopup(){ document.getElementById('popup').classList.remove('visible'); }
document.getElementById('popupSkipBtn').addEventListener('click', closePopup);
document.getElementById('popupJoinBtn').addEventListener('click', closePopup);

/* ── Overlay ── */
function showLoad(){
  hasError = false;
  overlay.classList.remove('gone');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'none';
  errOv.classList.remove('show');
}
function hideOverlay(){
  if(hasError) return;
  overlay.style.opacity = '0';
  overlay.style.pointerEvents = 'none';
  setTimeout(function(){ overlay.classList.add('gone'); }, 360);
}
function showErr(title, msg, showRetry){
  hasError = true;
  overlay.style.opacity = '0';
  overlay.style.pointerEvents = 'none';
  setTimeout(function(){ overlay.classList.add('gone'); }, 360);
  document.getElementById('etitle').textContent = title;
  document.getElementById('emsg').textContent = msg || '';
  document.getElementById('eretry').style.display = showRetry ? 'flex' : 'none';
  errOv.classList.add('show');
}

/* ── Center play button ── */
function syncBig(){
  if(vid.paused){ bigplay.classList.add('shown'); bigplay.classList.remove('gone'); }
  else           { bigplay.classList.remove('shown'); bigplay.classList.add('gone'); }
}
bpbtn.addEventListener('click', function(){ vid.play().catch(function(){}); });
vid.addEventListener('play',  syncBig);
vid.addEventListener('pause', syncBig);

/* ── Controls show/hide ── */
function showCtrls(){
  ctrls.classList.remove('gone');
  clearTimeout(hideTimer);
  if(!vid.paused){
    hideTimer = setTimeout(function(){
      ctrls.classList.add('gone');
      qpop.classList.remove('on');
    }, 3200);
  }
}
player.addEventListener('mousemove', showCtrls);
player.addEventListener('touchstart', showCtrls, {passive:true});
player.addEventListener('click', function(e){
  if(e.target === vid || e.target === player){
    if(ctrls.classList.contains('gone')) showCtrls();
    else togglePlay();
  }
});
showCtrls();

/* ── Play / Pause ── */
function togglePlay(){ if(vid.paused) vid.play().catch(function(){}); else { uPaused = true; vid.pause(); } }
bplay.addEventListener('click', togglePlay);

function syncPlayIcon(){
  pico.innerHTML = vid.paused
    ? '<path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72L9.5 4.27A1 1 0 0 0 8 5.14z" fill="currentColor"/>'
    : '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>';
}
vid.addEventListener('play',  function(){
  syncPlayIcon(); showCtrls(); uPaused = false;
  if(isLive && vid.seekable && vid.seekable.length > 0){
    var edge = vid.seekable.end(vid.seekable.length - 1);
    if(edge - vid.currentTime > 8) vid.currentTime = edge;
  }
});
vid.addEventListener('pause', function(){ syncPlayIcon(); showCtrls(); });

/* ── Volume ── */
bvol.addEventListener('click', function(){ vid.muted = !vid.muted; syncVol(); });
function syncVol(){
  if(vid.muted){
    vico.innerHTML = '<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><line x1="16" y1="9" x2="22" y2="15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="22" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>';
  } else {
    vico.innerHTML = '<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M19 6a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>';
  }
}

/* ── Live pill ── */
blivepill.addEventListener('click', function(){
  if(!isLive || !vid.seekable || !vid.seekable.length) return;
  var edge = vid.seekable.end(vid.seekable.length - 1);
  vid.currentTime = edge;
  if(vid.paused) vid.play().catch(function(){});
});
function syncLivePill(){
  if(!isLive){ blivepill.style.display = 'none'; return; }
  if(!vid.seekable || !vid.seekable.length) return;
  var edge = vid.seekable.end(vid.seekable.length - 1);
  var behind = edge - vid.currentTime > 10;
  blivepill.classList.toggle('behind', behind);
  lpitext.textContent = behind ? 'GO LIVE' : 'LIVE';
}
setInterval(syncLivePill, 2000);

/* ── Progress ── */
vid.addEventListener('timeupdate', function(){
  if(isDragging) return;
  var p = (vid.duration && isFinite(vid.duration)) ? vid.currentTime / vid.duration * 100 : 99.5;
  setP(p);
});
vid.addEventListener('progress', function(){
  if(!vid.buffered.length || !isFinite(vid.duration)) return;
  pbuf.style.width = (vid.buffered.end(vid.buffered.length-1) / vid.duration * 100) + '%';
});
vid.addEventListener('loadedmetadata', function(){
  isLive = !isFinite(vid.duration) || vid.duration > 86400;
  syncLivePill();
});
function setP(p){ p=Math.max(0,Math.min(100,p)); ppl.style.width=p+'%'; pth.style.left=p+'%'; }
function spct(e){ var r=prog.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; return Math.max(0,Math.min(1,x/r.width)); }
function applySeek(f){ if(!isFinite(vid.duration)) return; vid.currentTime=f*vid.duration; setP(f*100); }
prog.addEventListener('mousedown',  function(e){ isDragging=true; prog.classList.add('drag'); applySeek(spct(e)); });
prog.addEventListener('touchstart', function(e){ isDragging=true; prog.classList.add('drag'); applySeek(spct(e)); },{passive:true});
document.addEventListener('mousemove',  function(e){ if(isDragging) applySeek(spct(e)); });
document.addEventListener('touchmove',  function(e){ if(isDragging){ e.preventDefault(); applySeek(spct(e)); }},{passive:false});
document.addEventListener('mouseup',    function(){ if(isDragging){ isDragging=false; prog.classList.remove('drag'); }});
document.addEventListener('touchend',   function(){ if(isDragging){ isDragging=false; prog.classList.remove('drag'); }});

/* ── Fullscreen + landscape ── */
bfs.addEventListener('click', function(){
  var inFs = !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  if(!inFs){
    var p = player;
    var req = p.requestFullscreen||p.webkitRequestFullscreen||p.mozRequestFullScreen||p.msRequestFullscreen;
    if(req){
      req.call(p).then(function(){ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }).catch(function(){ if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen(); });
    } else if(vid.webkitEnterFullscreen){ vid.webkitEnterFullscreen(); }
  } else {
    var ex = document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
    if(ex) ex.call(document).catch(function(){});
    if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock();
  }
});
function syncFs(){
  var inFs = !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  fsico.innerHTML = inFs
    ? '<path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>'
    : '<path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/><path d="M15 20h5v-5"/>';
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(e){ document.addEventListener(e,syncFs); });

/* ── PiP ── */
if(!document.pictureInPictureEnabled) bpip.style.display = 'none';
bpip.addEventListener('click', function(){
  if(document.pictureInPictureElement) document.exitPictureInPicture().catch(function(){});
  else vid.requestPictureInPicture().catch(function(){});
});

/* ── Quality menu ── */
function buildQMenu(streams){
  var avail = Q_ORDER.filter(function(q){ return streams[q]; });
  if(!avail.length){ bq.style.display='none'; return; }
  bq.style.display='';
  var h = '<div class="qhd">Quality</div>';
  avail.forEach(function(q){ h += '<div class="qopt'+(q===currentQ?' on':'')+'" data-q="'+q+'">'+q+'</div>'; });
  qpop.innerHTML = h;
  qpop.querySelectorAll('.qopt').forEach(function(el){
    el.addEventListener('click', function(){ var q=el.dataset.q; qpop.classList.remove('on'); if(q!==currentQ) switchQ(q); });
  });
}
bq.addEventListener('click', function(e){ e.stopPropagation(); qpop.classList.toggle('on'); showCtrls(); });
document.addEventListener('click', function(e){ if(!e.target.closest('#bq')&&!e.target.closest('#qpop')) qpop.classList.remove('on'); });
function switchQ(q){
  if(!qStreams[q]) return;
  currentQ = q; qlbl.textContent = q;
  qpop.querySelectorAll('.qopt').forEach(function(o){ o.classList.toggle('on', o.dataset.q===q); });
  loadStream(qStreams[q], []);
}

/* ── Auto-resume (for buffering, not user pause) ── */
vid.addEventListener('pause', function(){
  if(!vid.ended && !uPaused){
    setTimeout(function(){ if(vid.paused && !vid.ended && !uPaused) vid.play().catch(function(){}); }, 800);
  }
});
vid.addEventListener('play', function(){ uPaused = false; });
setInterval(function(){ if(vid.paused && !vid.ended && !uPaused) vid.play().catch(function(){}); }, 4000);

/* ── Shaka loader with fallback chain ── */
async function tryShaka(url){
  if(shakaPlayer){ try{ await shakaPlayer.destroy(); }catch(e){} shakaPlayer=null; }
  shakaPlayer = new shaka.Player();
  await shakaPlayer.attach(vid);
  shakaPlayer.configure({ streaming:{ bufferingGoal:10, rebufferingGoal:2, safeSeekOffset:5, lowLatencyMode:true } });
  shakaPlayer.getNetworkingEngine().registerRequestFilter(function(t,req){ req.allowCrossSiteCredentials = true; });
  await shakaPlayer.load(url);
}

async function loadStream(url, fallbacks){
  hasError = false;
  shaka.polyfill.installAll();
  var all = [url].concat((fallbacks||[]).filter(function(u){ return u && u !== url; }));
  var lastErr = null;

  if(shaka.Player.isBrowserSupported()){
    for(var i=0; i<all.length; i++){
      if(!all[i]) continue;
      try{ await tryShaka(all[i]); lastErr=null; break; }
      catch(e){
        var hs = (e.data && e.data[1]) ? ' (HTTP '+e.data[1]+')' : '';
        lastErr = 'Shaka Error '+((e.code)||'?')+hs;
        if(shakaPlayer){ try{ await shakaPlayer.destroy(); }catch(x){} shakaPlayer=null; }
      }
    }
  } else { lastErr = 'unsupported'; }

  if(lastErr){
    var nUrl = all[0]||url;
    if(vid.canPlayType('application/vnd.apple.mpegurl')){
      vid.src = nUrl; lastErr = null;
    }
  }

  if(lastErr){ showErr('Playback Error', lastErr, false); return; }

  vid.muted = false;
  try{ await vid.play(); }
  catch(e){ vid.muted=true; await vid.play().catch(function(){}); setTimeout(function(){ vid.muted=false; vid.play().catch(function(){}); },1000); }

  var onP = function(){ vid.removeEventListener('playing',onP); hideOverlay(); };
  vid.addEventListener('playing', onP);
  setTimeout(function(){ if(!hasError) hideOverlay(); }, 9000);
}

/* ── JSON fetch ── */
function fetchJSON(url){
  return new Promise(function(res,rej){
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 12000;
    x.onreadystatechange = function(){
      if(x.readyState!==4) return;
      if(x.status>=200&&x.status<300){ try{ res(JSON.parse(x.responseText)); }catch(e){ rej(new Error('JSON parse error')); } }
      else rej(new Error('HTTP '+x.status));
    };
    x.onerror   = function(){ rej(new Error('Network error')); };
    x.ontimeout = function(){ rej(new Error('Timeout')); };
    x.send();
  });
}

function resolve(data){
  var list = Array.isArray(data) ? data : (Array.isArray(data.matches) ? data.matches : []);
  if(!list.length) throw new Error('No matches in JSON');
  var m = null;
  for(var i=0;i<list.length;i++) if(String(list[i].match_id)===String(matchId)){m=list[i];break;}
  if(!m) throw new Error('Match "'+matchId+'" not found ('+list.length+' total)');
  var s = m.streams || {};
  var fb = [s.primary,s.fancode_cdn,s.fancode_lk_cdn,s.fancode_bd_cdn,s.fancode_np_cdn].filter(Boolean);
  if(si===0){
    var as = m.auto_streams || {};
    var keys = Object.keys(as);
    if(!keys.length) throw new Error('No stream — match is upcoming or not started');
    var lang = LANG_MAP[langCode] || m.language || keys[0];
    var al = as[lang] || as[keys[0]];
    if(!al||!al.streams||!Object.keys(al.streams).length) throw new Error('Stream URLs empty');
    return {type:'multi', streams:al.streams, fallbacks:fb};
  }
  var u = si===1?s.fancode_lk_cdn:si===2?s.fancode_np_cdn:si===3?s.fancode_bd_cdn:null;
  if(!u) throw new Error('Regional stream (s='+si+') not available');
  return {type:'single', url:u, fallbacks:fb};
}

/* ── Boot ── */
(function start(){
  showLoad();
  if(!matchId){ showErr('Missing match ID', 'URL: ?id=MATCHID_LANG&s=0', false); return; }
  fetchJSON(JSON_URL).then(function(data){
    var r; try{ r=resolve(data); }catch(e){ showErr('Stream Unavailable', e.message, true); retryTimer=setTimeout(start,8000); return; }
    if(r.type==='multi'){
      qStreams=r.streams;
      var url=r.streams['720p']||r.streams['1080p']||r.streams['480p']||r.streams['540p']||r.streams['360p']||r.streams['240p'];
      if(!url){ showErr('No stream URL', 'All quality URLs empty', true); return; }
      currentQ=Q_ORDER.find(function(q){return r.streams[q]===url;})||'720p';
      qlbl.textContent=currentQ; buildQMenu(r.streams); loadStream(url, r.fallbacks);
    } else { bq.style.display='none'; loadStream(r.url, r.fallbacks); }
  }).catch(function(e){ showErr('Could not load data', e.message, true); retryTimer=setTimeout(start,8000); });
})();
})();
