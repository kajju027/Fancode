<body>
<div class="shaka-video-container" id="player-container">
    <video id="video" autoplay muted playsinline preload="metadata"></video>
    <div class="custom-watermark">LIVE · FANCODE</div>
    <div id="overlay">
        <div class="spinner" id="spinner"></div>
        <div id="err-box">
            <div class="err-title" id="err-title"></div>
            <div class="err-detail" id="err-detail"></div>
        </div>
    </div>
</div>
<div id="telegramModal" class="modal hidden"></div>
<script>
(function () {
    var JSON_URL  = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/main/fancode.json';
    var LANG_MAP  = { eng:'ENGLISH', hin:'HINDI', tam:'TAMIL', tel:'TELUGU', ben:'BENGALI', mar:'MARATHI' };
    var QUAL_PREF = ['720p','1080p','480p','540p','360p','240p'];

    var params   = new URLSearchParams(window.location.search);
    var idParam  = params.get('id') || '';
    var uscIdx   = idParam.indexOf('_');
    var matchId  = uscIdx > -1 ? idParam.slice(0, uscIdx) : idParam;
    var langCode = uscIdx > -1 ? idParam.slice(uscIdx + 1) : 'eng';

    var video     = document.getElementById('video');
    var container = document.getElementById('player-container');
    var overlay   = document.getElementById('overlay');
    var spinner   = document.getElementById('spinner');
    var errBox    = document.getElementById('err-box');
    var errTitle  = document.getElementById('err-title');
    var errDetail = document.getElementById('err-detail');
    var shakaPlayer = null;
    var userPaused  = false;

    function showError(title, detail) {
        spinner.style.display = 'none';
        errBox.style.display  = 'block';
        errTitle.textContent  = title;
        errDetail.innerHTML   = detail || '';
        overlay.style.pointerEvents = 'auto';
    }

    function hideOverlay() {
        overlay.style.opacity    = '0';
        overlay.style.transition = 'opacity .4s';
        setTimeout(function () { overlay.style.display = 'none'; }, 420);
    }

    function fetchJSON(url) {
        return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.timeout = 10000;
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) return;
                if (xhr.status >= 200 && xhr.status < 300) {
                    try { resolve(JSON.parse(xhr.responseText)); }
                    catch (e) { reject(new Error('JSON parse failed: ' + e.message)); }
                } else {
                    reject(new Error('HTTP ' + xhr.status + ' — ' + url));
                }
            };
            xhr.onerror   = function () { reject(new Error('Network error (XHR onerror)')); };
            xhr.ontimeout = function () { reject(new Error('Request timed out after 10s')); };
            xhr.send();
        });
    }

    function resolveUrl(data) {
        var list = Array.isArray(data) ? data :
                   Array.isArray(data.matches) ? data.matches :
                   Array.isArray(data.events)  ? data.events  :
                   Array.isArray(data.data)     ? data.data    : [];

        if (!list.length) throw new Error('JSON has no match list (checked data, data.matches, data.events, data.data)');

        var match = null;
        for (var i = 0; i < list.length; i++) {
            if (String(list[i].match_id) === String(matchId)) { match = list[i]; break; }
        }
        if (!match) throw new Error('match_id "' + matchId + '" not found in JSON (' + list.length + ' matches checked)');
        if (!match.auto_streams || !Object.keys(match.auto_streams).length) throw new Error('auto_streams is empty for match ' + matchId);

        var lang     = LANG_MAP[langCode] || match.language || 'ENGLISH';
        var autoLang = match.auto_streams[lang];
        if (!autoLang || !autoLang.streams) {
            var keys = Object.keys(match.auto_streams);
            if (!keys.length) throw new Error('No language keys found in auto_streams');
            autoLang = match.auto_streams[keys[0]];
            lang     = keys[0];
        }
        if (!autoLang.streams || !Object.keys(autoLang.streams).length) throw new Error('streams object empty for language "' + lang + '"');

        for (var j = 0; j < QUAL_PREF.length; j++) {
            if (autoLang.streams[QUAL_PREF[j]]) return autoLang.streams[QUAL_PREF[j]];
        }
        throw new Error('No usable quality URL found (checked: ' + QUAL_PREF.join(', ') + ')');
    }

    function setupAutoResume() {
        document.addEventListener('click', function (e) {
            if (e.target.closest && e.target.closest('.shaka-play-button') && !video.paused) userPaused = true;
        });
        video.addEventListener('pause', function () {
            if (!video.ended && !userPaused) setTimeout(function () { if (video.paused && !video.ended) video.play().catch(function () {}); }, 500);
            setTimeout(function () { userPaused = false; }, 100);
        });
        video.addEventListener('play', function () { userPaused = false; });
        setInterval(function () { if (video.paused && !video.ended && !userPaused) video.play().catch(function () {}); }, 3000);
    }

    function playNative(streamUrl) {
        if (shakaPlayer) { shakaPlayer.destroy().catch(function () {}); shakaPlayer = null; }
        video.src = streamUrl;
        video.muted = false;
        video.play().catch(function () {
            video.muted = true;
            video.play().catch(function (e) { showError('Playback failed', 'Native HLS error: ' + e.message); });
            setTimeout(function () { video.muted = false; video.play().catch(function () {}); }, 1000);
        });
    }

    async function initPlayer(streamUrl) {
        shaka.polyfill.installAll();

        video.addEventListener('playing', function onPlaying() {
            video.removeEventListener('playing', onPlaying);
            hideOverlay();
        });
        setTimeout(hideOverlay, 8000);

        if (!shaka.Player.isBrowserSupported()) {
            playNative(streamUrl);
            return;
        }

        try {
            shakaPlayer = new shaka.Player();
            await shakaPlayer.attach(video);

            var ui = new shaka.ui.Overlay(shakaPlayer, container, video);
            ui.configure({
                addBigPlayButton: true,
                addSeekBar: true,
                controlPanelElements: ['mute','play_pause','time_and_duration','spacer','picture_in_picture','fullscreen'],
                seekBarColors: { base:'rgba(255,255,255,0.2)', buffered:'rgba(255,255,255,0.4)', played:'#ff3b30' }
            });
            shakaPlayer.configure({ streaming: { bufferingGoal:10, rebufferingGoal:2, safeSeekOffset:5, lowLatencyMode:true } });

            await shakaPlayer.load(streamUrl);
            video.muted = false;
            try { await video.play(); }
            catch (e) {
                video.muted = true;
                await video.play();
                setTimeout(function () { video.muted = false; video.play().catch(function () {}); }, 1000);
            }
        } catch (err) {
            console.warn('Shaka failed:', err);
            try {
                if (shakaPlayer) { await shakaPlayer.destroy(); shakaPlayer = null; }
            } catch (e) {}
            playNative(streamUrl);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        setupAutoResume();
        if (!matchId) { showError('Missing match ID', 'URL must include ?id=MATCHID_LANG&s=0<br>Example: ?id=143540_eng&s=0'); return; }

        fetchJSON(JSON_URL)
            .then(function (data) {
                var url;
                try { url = resolveUrl(data); }
                catch (e) { showError('Stream not available', e.message); return; }
                initPlayer(url);
            })
            .catch(function (err) {
                showError('Failed to load data', err.message);
            });
    });
})();
</script>
