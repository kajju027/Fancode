.qhd{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.28);padding:5px 10px 8px;}

.qdot{width:6px;height:6px;border-radius:50%;background:var(--red);opacity:0;flex-shrink:0;}
.qopt.on .qdot{opacity:1;}

.wm{position:absolute;z-index:15;bottom:74px;right:14px;font-size:11px;font-weight:600;color:rgba(255,255,255,.09);letter-spacing:.5px;text-transform:uppercase;pointer-events:none;}
#lbtn{position:absolute;top:12px;left:12px;z-index:22;text-decoration:none;opacity:0;transition:opacity .3s;}

#lbtn img{height:34px;border-radius:8px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.8));}

@media(max-width:700px){

  .bpr{width:64px;height:64px;}.bpr svg{width:26px;margin-left:3px;}
}

<script>
(function(){
'use strict';

var JSON_URL = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
var LANG_MAP = {eng:'ENGLISH',hin:'HINDI',tam:'TAMIL',tel:'TELUGU',ben:'BENGALI',mar:'MARATHI'};
var Q_ORDER  = ['1080p','720p','540p','480p','360p','240p'];

var sp = new URLSearchParams(location.search);
var idp = sp.get('id') || '';
var si  = parseInt(sp.get('s') || '0', 10);
var ui  = idp.indexOf('_');
var matchId  = ui > -1 ? idp.slice(0, ui) : idp;
var langCode = ui > -1 ? idp.slice(ui + 1) : 'eng';

var vid    = document.getElementById('vid');
var player = document.getElementById('player');
var overlay= document.getElementById('overlay');
var ctrls  = document.getElementById('ctrls');
var prog   = document.getElementById('prog');
var pbuf   = document.getElementById('pbuf');
var ppl    = document.getElementById('ppl');
var pth    = document.getElementById('pth');
var tdisp  = document.getElementById('tdisp');
var bplay  = document.getElementById('bplay');
var pico   = document.getElementById('pico');
var bvol   = document.getElementById('bvol');
var vico   = document.getElementById('vico');
var bq     = document.getElementById('bq');
var qlbl   = document.getElementById('qlbl');
var bpip   = document.getElementById('bpip');
var bfs    = document.getElementById('bfs');
var fsico  = document.getElementById('fsico');
var qpop   = document.getElementById('qpop');
var lbtn   = document.getElementById('lbtn');
var bigplay= document.getElementById('bigplay');
var bpbtn  = document.getElementById('bpbtn');

var shakaPlayer = null;
var qStreams = {}, currentQ = '720p';
var isLive = true, isDragging = false, uPaused = false, hasError = false;
var hideTimer = null;

/* ── popup ── */
['bjoin','bskip'].forEach(function(id){
  document.getElementById(id).addEventListener('click', function(){document.getElementById('popup').classList.add('gone');});
});

/* ── overlay ── */
function showLoad(){
  hasError = false;
  overlay.classList.remove('gone');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'none';
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('err-card').style.display = 'none';
}
function hideOverlay(){
  if(hasError) return;
  overlay.style.opacity = '0';
  overlay.style.pointerEvents = 'none';
  setTimeout(function(){overlay.classList.add('gone');}, 350);
}
function showErr(t, m){
  hasError = true;
  overlay.classList.remove('gone');
  overlay.style.opacity = '1';
  overlay.style.pointerEvents = 'auto';
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('err-card').style.display = 'block';
  document.getElementById('etitle').textContent = t;
  document.getElementById('emsg').textContent = m || '';
}

/* ── big center play button ── */
function syncBig(){
  if(vid.paused){ bigplay.classList.add('shown'); bigplay.classList.remove('gone'); }
  else          { bigplay.classList.remove('shown'); bigplay.classList.add('gone'); }
}
bpbtn.addEventListener('click', function(){ vid.play().catch(function(){}); });
vid.addEventListener('play',  syncBig);
vid.addEventListener('pause', syncBig);

/* ── controls show/hide ── */
function showCtrls(){
  ctrls.classList.remove('gone');
  lbtn.classList.add('on');
  clearTimeout(hideTimer);
  if(!vid.paused){
    hideTimer = setTimeout(function(){
      ctrls.classList.add('gone');
      lbtn.classList.remove('on');
      qpop.classList.remove('on');
    }, 3000);
  }
}
player.addEventListener('mousemove', showCtrls);
player.addEventListener('touchstart', showCtrls, {passive:true});
player.addEventListener('click', function(e){
  if(e.target === vid || e.target === player){
    if(ctrls.classList.contains('gone')) showCtrls();
    else togglePlay();
  }
});
showCtrls();

/* ── play/pause ── */
function togglePlay(){ if(vid.paused) vid.play().catch(function(){}); else vid.pause(); }
bplay.addEventListener('click', togglePlay);
function syncPlayIcon(){
  pico.innerHTML = vid.paused
    ? '<path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72L9.5 4.27A1 1 0 0 0 8 5.14z" fill="currentColor"/>'
    : '<rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>';
}
vid.addEventListener('play',  function(){ syncPlayIcon(); showCtrls(); });
vid.addEventListener('pause', function(){ syncPlayIcon(); showCtrls(); });

/* ── volume ── */
bvol.addEventListener('click', function(){ vid.muted = !vid.muted; syncVol(); });
function syncVol(){
  vico.innerHTML = vid.muted
    ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'
    : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
}

/* ── progress ── */
vid.addEventListener('timeupdate', function(){
  if(isDragging) return;
  var p = (vid.duration && isFinite(vid.duration)) ? vid.currentTime / vid.duration * 100 : 99.4;
  setP(p); updateTime();
});
vid.addEventListener('progress', function(){
  if(!vid.buffered.length || !isFinite(vid.duration)) return;
  pbuf.style.width = (vid.buffered.end(vid.buffered.length-1) / vid.duration * 100) + '%';
});
vid.addEventListener('loadedmetadata', function(){
  isLive = !isFinite(vid.duration) || vid.duration > 86400;
  updateTime();
});
function setP(p){ p = Math.max(0, Math.min(100, p)); ppl.style.width = p+'%'; pth.style.left = p+'%'; }
function updateTime(){
  if(isLive) tdisp.innerHTML = '<span class="live-pill">LIVE</span>';
  else tdisp.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
}
function fmt(s){ if(!s||!isFinite(s)) return '0:00'; var m=Math.floor(s/60),sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }
function spct(e){ var r=prog.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; return Math.max(0,Math.min(1,x/r.width)); }
function applySeek(f){ if(!isFinite(vid.duration)) return; vid.currentTime=f*vid.duration; setP(f*100); }
prog.addEventListener('mousedown',  function(e){ isDragging=true; prog.classList.add('drag'); applySeek(spct(e)); });
prog.addEventListener('touchstart', function(e){ isDragging=true; prog.classList.add('drag'); applySeek(spct(e)); }, {passive:true});
document.addEventListener('mousemove',  function(e){ if(isDragging) applySeek(spct(e)); });
document.addEventListener('touchmove',  function(e){ if(isDragging){ e.preventDefault(); applySeek(spct(e)); }}, {passive:false});
document.addEventListener('mouseup',    function(){ if(isDragging){ isDragging=false; prog.classList.remove('drag'); }});
document.addEventListener('touchend',   function(){ if(isDragging){ isDragging=false; prog.classList.remove('drag'); }});

/* ── fullscreen + landscape ── */
bfs.addEventListener('click', function(){
  var inFs = !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  if(!inFs){
    var p = player;
    var req = p.requestFullscreen||p.webkitRequestFullscreen||p.mozRequestFullScreen||p.msRequestFullscreen;
    if(req){
      req.call(p).then(function(){
        if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});
      }).catch(function(){ if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen(); });
    } else if(vid.webkitEnterFullscreen){ vid.webkitEnterFullscreen(); }
  } else {
    var ex = document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
    if(ex) ex.call(document).catch(function(){});
    if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock();
  }
});
function syncFs(){
  var inFs = !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  fsico.innerHTML = inFs
    ? '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>'
    : '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(e){ document.addEventListener(e, syncFs); });

/* ── pip ── */
if(!document.pictureInPictureEnabled) bpip.style.display = 'none';
bpip.addEventListener('click', function(){
  if(document.pictureInPictureElement) document.exitPictureInPicture().catch(function(){});
  else vid.requestPictureInPicture().catch(function(){});
});

/* ── quality menu ── */
function buildQMenu(streams){
  var avail = Q_ORDER.filter(function(q){ return streams[q]; });
  if(!avail.length){ bq.style.display='none'; return; }
  bq.style.display = '';
  var h = '<div class="qhd">Quality</div>';
  avail.forEach(function(q){ h += '<div class="qopt'+(q===currentQ?' on':'')+'" data-q="'+q+'">'+q+'<span class="qdot"></span></div>'; });
  qpop.innerHTML = h;
  qpop.querySelectorAll('.qopt').forEach(function(el){
    el.addEventListener('click', function(){ var q=el.dataset.q; qpop.classList.remove('on'); if(q!==currentQ) switchQ(q); });
  });
}
bq.addEventListener('click', function(e){ e.stopPropagation(); qpop.classList.toggle('on'); showCtrls(); });
document.addEventListener('click', function(e){ if(!e.target.closest('#bq')&&!e.target.closest('#qpop')) qpop.classList.remove('on'); });
function switchQ(q){
  if(!qStreams[q]) return;
  currentQ = q; qlbl.textContent = q;

/* ── auto-resume ── */
vid.addEventListener('pause', function(){
  if(!vid.ended&&!uPaused) setTimeout(function(){ if(vid.paused&&!vid.ended) vid.play().catch(function(){}); }, 600);
  setTimeout(function(){ uPaused=false; }, 120);
});
vid.addEventListener('play', function(){ uPaused=false; });
setInterval(function(){ if(vid.paused&&!vid.ended&&!uPaused) vid.play().catch(function(){}); }, 3500);

/* ── Shaka stream loader ── */
async function tryShaka(url){
  if(shakaPlayer){ try{ await shakaPlayer.destroy(); }catch(e){} shakaPlayer=null; }
  shakaPlayer = new shaka.Player();
  await shakaPlayer.attach(vid);
  shakaPlayer.configure({ streaming:{ bufferingGoal:10, rebufferingGoal:2, safeSeekOffset:5, lowLatencyMode:true } });
  shakaPlayer.getNetworkingEngine().registerRequestFilter(function(t,req){
    req.allowCrossSiteCredentials = true;
  });
  await shakaPlayer.load(url);
}

async function loadStream(url, fallbackUrls){
  hasError = false;
  fallbackUrls = fallbackUrls || [];

  shaka.polyfill.installAll();

  var allUrls = [url].concat(fallbackUrls.filter(function(u){ return u && u !== url; }));
  var lastErr = null;

  if(shaka.Player.isBrowserSupported()){
    for(var i=0; i<allUrls.length; i++){
      var u = allUrls[i];
      if(!u) continue;
      try{
        await tryShaka(u);
        lastErr = null;
        break;
      } catch(err){
        var httpStatus = (err.data && err.data[1]) ? err.data[1] : '';
        console.warn('Shaka failed url['+i+']:', u, 'code:', err.code, 'HTTP:', httpStatus, err);
        lastErr = 'Shaka Error ' + (err.code||'?') + (httpStatus ? ' (HTTP '+httpStatus+')' : '') + '\nURL tried: ...'+u.slice(-60);
        if(shakaPlayer){ try{ await shakaPlayer.destroy(); }catch(e){} shakaPlayer=null; }
      }
    }
  } else {
    lastErr = 'shaka_unsupported';
  }

  if(lastErr){
    if(lastErr === 'shaka_unsupported' || allUrls.length){
      var nativeUrl = allUrls[0] || url;
      if(vid.canPlayType('application/vnd.apple.mpegurl')){
        vid.src = nativeUrl;
        vid.muted = false;
        vid.play().catch(function(){ vid.muted=true; vid.play().catch(function(){}); setTimeout(function(){ vid.muted=false; vid.play().catch(function(){}); },1000); });
        lastErr = null;
      }
    }
  }

  if(lastErr){
    showErr('Playback Error', lastErr);
    return;
  }

  vid.muted = false;
  try{ await vid.play(); }
  catch(e){
    vid.muted = true;
    await vid.play().catch(function(){});
    setTimeout(function(){ vid.muted=false; vid.play().catch(function(){}); }, 1000);
  }

  var onP = function(){ vid.removeEventListener('playing',onP); hideOverlay(); };
  vid.addEventListener('playing', onP);
  setTimeout(function(){ if(!hasError) hideOverlay(); }, 8000);
}

/* ── JSON fetch ── */
function fetchJSON(url){
  return new Promise(function(res,rej){
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 12000;
    x.onreadystatechange = function(){
      if(x.readyState !== 4) return;
      if(x.status >= 200 && x.status < 300){
        try{ res(JSON.parse(x.responseText)); } catch(e){ rej(new Error('JSON parse error: '+e.message)); }
      } else rej(new Error('HTTP '+x.status));
    };
    x.onerror   = function(){ rej(new Error('Network error')); };
    x.ontimeout = function(){ rej(new Error('Timeout (12s)')); };
    x.send();
  });
}

function resolve(data){
  var list = Array.isArray(data) ? data : (Array.isArray(data.matches) ? data.matches : []);
  if(!list.length) throw new Error('No matches in JSON');
  var m = null;
  for(var i=0;i<list.length;i++) if(String(list[i].match_id)===String(matchId)){m=list[i];break;}
  if(!m) throw new Error('match_id "'+matchId+'" not found ('+list.length+' matches in JSON)');

  var s = m.streams || {};
  var fallbacks = [s.primary, s.fancode_cdn, s.fancode_lk_cdn, s.fancode_bd_cdn, s.fancode_np_cdn].filter(Boolean);

  if(si === 0){
    var as = m.auto_streams || {};
    var asKeys = Object.keys(as);
    if(!asKeys.length) throw new Error('auto_streams is empty — match UPCOMING or stream not started');
    var lang = LANG_MAP[langCode] || m.language || asKeys[0];
    var al = as[lang] || as[asKeys[0]];
    if(!al || !al.streams || !Object.keys(al.streams).length) throw new Error('Stream URLs empty in auto_streams');
    return {type:'multi', streams:al.streams, fallbacks:fallbacks};
  }

  var u = si===1?s.fancode_lk_cdn : si===2?s.fancode_np_cdn : si===3?s.fancode_bd_cdn : null;
  if(!u) throw new Error('Regional stream (s='+si+') not available');
  return {type:'single', url:u, fallbacks:fallbacks};
}

/* ── boot ── */
(function start(){
  showLoad();
  if(!matchId){ showErr('Missing match ID', '?id=MATCHID_LANG&s=0 required'); return; }

  fetchJSON(JSON_URL).then(function(data){
    var r;
    try{ r = resolve(data); } catch(e){ showErr('Stream Unavailable', e.message); return; }

    if(r.type === 'multi'){
      qStreams = r.streams;
      var url = r.streams['720p']||r.streams['1080p']||r.streams['480p']||r.streams['540p']||r.streams['360p']||r.streams['240p'];
      if(!url){ showErr('No stream URL', 'All quality URLs are empty for this match'); return; }
      currentQ = Q_ORDER.find(function(q){ return r.streams[q]===url; }) || '720p';
      qlbl.textContent = currentQ;
      buildQMenu(r.streams);
      loadStream(url, r.fallbacks);
    } else {
      bq.style.display = 'none';
      loadStream(r.url, r.fallbacks);
    }
  }).catch(function(e){ showErr('Data fetch failed', e.message); });
})();
})();
