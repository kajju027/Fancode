        }
        #quality-menu.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: auto; }
        .qm-header {

            #quality-menu { right: 46px; bottom: 64px; }

<body>

<div class="shaka-video-container" id="player-container">
    <video id="video" autoplay muted playsinline preload="metadata"></video>
    <div class="custom-watermark">LIVE · FANCODE</div>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div id="quality-menu"></div>
</div>

<div id="telegramModal" class="modal hidden"></div>

<script>
(function() {
    const JSON_URL  = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
    const QUALITIES = ['1080p', '720p', '540p', '480p', '360p', '240p'];
    const DEFAULT_Q = '720p';
    const LANG_MAP  = { eng:'ENGLISH', hin:'HINDI', tam:'TAMIL', tel:'TELUGU', ben:'BENGALI', mar:'MARATHI' };

    const params    = new URLSearchParams(window.location.search);
    const idParam   = params.get('id') || '';
    const streamIdx = parseInt(params.get('s') || '0', 10);
    const uscIdx    = idParam.indexOf('_');
    const matchId   = uscIdx > -1 ? idParam.slice(0, uscIdx) : idParam;
    const langCode  = uscIdx > -1 ? idParam.slice(uscIdx + 1) : 'eng';
    const language  = LANG_MAP[langCode] || 'ENGLISH';

    const video     = document.getElementById('video');
    const container = document.getElementById('player-container');
    const loading   = document.getElementById('loading');
    const qMenu     = document.getElementById('quality-menu');

    let player       = null;
    let currentQ     = DEFAULT_Q;
    let qStreams      = {};
    let isQualityMode = false;
    let userPaused    = false;

    async function fetchStream() {
        const res  = await fetch(JSON_URL + '?nc=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        const list = Array.isArray(data) ? data :
                     Array.isArray(data.matches) ? data.matches :
                     Array.isArray(data.events)  ? data.events  :
                     Array.isArray(data.data)     ? data.data    : [];

        const match = list.find(m => String(m.match_id) === String(matchId));
        if (!match) throw new Error('Match not found: ' + matchId);

        if (streamIdx === 0) {
            const autoLang = match.auto_streams &&
                             (match.auto_streams[language] || match.auto_streams['ENGLISH']);
            if (!autoLang?.streams) throw new Error('Auto streams not available');
            isQualityMode = true;
            return { type: 'quality', streams: autoLang.streams };
        }

        const s   = match.streams || {};
        const url = streamIdx === 1 ? s.fancode_lk_cdn :
                    streamIdx === 2 ? s.fancode_np_cdn  :
                    streamIdx === 3 ? s.fancode_bd_cdn  : null;
        if (!url) throw new Error('Regional stream not found');
        return { type: 'single', url };
    }

    function buildQMenu(streams) {
        const available = QUALITIES.filter(q => streams[q]);
        let html = '<div class="qm-header">Quality</div>';
        available.forEach(q => {
            html += `<div class="qm-opt${q === currentQ ? ' active' : ''}" data-q="${q}">${q}<span class="qm-dot"></span></div>`;
        });
        qMenu.innerHTML = html;
        qMenu.querySelectorAll('.qm-opt').forEach(opt => {
            opt.addEventListener('click', () => {
                const q = opt.dataset.q;
                if (q !== currentQ) switchQuality(q);
                qMenu.classList.remove('open');
            });
        });
    }

    async function switchQuality(q) {
        if (!qStreams[q] || !player) return;
        currentQ = q;
        const lbl = document.getElementById('qlabel');
        if (lbl) lbl.textContent = q;
        qMenu.querySelectorAll('.qm-opt').forEach(o => o.classList.toggle('active', o.dataset.q === q));
        const wasPlaying = !video.paused;
        try {
            await player.load(qStreams[q]);
            if (wasPlaying) video.play().catch(() => {});
        } catch(e) { console.warn('Quality switch error:', e); }
    }

    function injectQualityBtn() {
        if (document.getElementById('quality-btn')) return;
        let attempts = 0;
        const iv = setInterval(() => {
            attempts++;
            const fsBtn = container.querySelector('.shaka-fullscreen-button') ||
                          container.querySelector('[aria-label="Full screen"]')  ||
                          container.querySelector('[aria-label="Fullscreen"]');
            if (fsBtn?.parentNode) {
                clearInterval(iv);
                if (document.getElementById('quality-btn')) return;
                const btn = document.createElement('button');
                btn.id = 'quality-btn';
                btn.setAttribute('aria-label', 'Quality');
                btn.innerHTML = `<span id="qlabel">${currentQ}</span>`;
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    qMenu.classList.toggle('open');
                });
                fsBtn.parentNode.insertBefore(btn, fsBtn);
            }
            if (attempts > 60) clearInterval(iv);
        }, 80);
    }

    document.addEventListener('click', e => {
        if (!e.target.closest('#quality-btn') && !e.target.closest('#quality-menu')) {
            qMenu.classList.remove('open');
        }
        if (e.target.closest('.shaka-play-button') && !video.paused) userPaused = true;
    });

    async function initPlayer(streamUrl) {
        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
            video.src = streamUrl;
            video.muted = false;
            video.play().catch(() => { video.muted = true; video.play(); });
            video.addEventListener('playing', () => { loading.style.display = 'none'; }, { once: true });
            setTimeout(() => { loading.style.display = 'none'; }, 6000);
            return;
        }

        try {
            player = new shaka.Player();
            await player.attach(video);

            const ui = new shaka.ui.Overlay(player, container, video);
            ui.configure({
                addBigPlayButton: true,
                addSeekBar: true,
                controlPanelElements: [
                    'mute',
                    'play_pause',
                    'time_and_duration',
                    'spacer',
                    'picture_in_picture',
                    'fullscreen'
                ],
                seekBarColors: {
                    base:     'rgba(255,255,255,0.2)',
                    buffered: 'rgba(255,255,255,0.4)',
                    played:   '#ff3b30'
                }
            });

            player.configure({
                streaming: {
                    bufferingGoal:   10,
                    rebufferingGoal: 2,
                    safeSeekOffset:  5,
                    lowLatencyMode:  true
                }
            });

            if (isQualityMode) injectQualityBtn();

            await player.load(streamUrl);

            video.muted = false;
            try {
                await video.play();
            } catch (e) {
                video.muted = true;
                await video.play();
                setTimeout(() => { video.muted = false; video.play().catch(() => {}); }, 1000);
            }

            video.addEventListener('playing', () => { loading.style.display = 'none'; }, { once: true });
            setTimeout(() => { loading.style.display = 'none'; }, 6000);

            let userPaused = false;
            document.addEventListener('click', e => {
                if (e.target.closest('.shaka-play-button') && !video.paused) userPaused = true;
            });
            video.addEventListener('pause', () => {
                if (!video.ended && !userPaused) {
                    setTimeout(() => { if (video.paused && !video.ended) video.play().catch(() => {}); }, 500);
                }
                setTimeout(() => { userPaused = false; }, 100);
            });
            video.addEventListener('play', () => { userPaused = false; });
            setInterval(() => {
                if (video.paused && !video.ended && !userPaused) video.play().catch(() => {});
            }, 3000);

        } catch (e) {
            console.warn('Shaka error, falling back to native HLS:', e);
            if (player) { player.destroy().catch(() => {}); player = null; }
            video.src = streamUrl;
            video.muted = false;
            video.play().catch(() => {
                video.muted = true;
                video.play().catch(() => {});
            });
            video.addEventListener('playing', () => { loading.style.display = 'none'; }, { once: true });
            setTimeout(() => { loading.style.display = 'none'; }, 6000);
        }
    }

    async function start() {
        loading.style.display = 'flex';
        if (!matchId) { loading.style.display = 'none'; return; }

        try {
            const result = await fetchStream();

            if (result.type === 'quality') {
                qStreams = result.streams;
                buildQMenu(result.streams);
                const defaultUrl = result.streams[DEFAULT_Q] ||
                                   result.streams['480p']    ||
                                   Object.values(result.streams)[0];
                await initPlayer(defaultUrl);
            } else {
                await initPlayer(result.url);
            }

        } catch (err) {
            console.error('Error:', err);
            loading.innerHTML = `<div style="font-size:13px;color:rgba(255,255,255,.45);text-align:center;padding:20px">${err.message || 'Stream unavailable'}</div>`;
        }
    }

    document.addEventListener('DOMContentLoaded', start);
})();
</script>

<script>(function(s){s.dataset.zone='10603308',s.src='https://llvpn.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

</body>
